# ============================================================
# Toko Almas POS & Stok Opname - Docker Compose Configuration
# ============================================================
# This file provides a complete development environment with
# PostgreSQL database for the Toko Almas system.
# ============================================================

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: tokoalmas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kasirku
      # Enable uuid-ossp extension support
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/1-init_schema.sql
      # Add additional migration scripts if needed
      # - ./database_migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/1-init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kasirku"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tokoalmas-network
    restart: unless-stopped

  # Optional: Adminer for database management (development only)
  adminer:
    image: adminer:latest
    container_name: tokoalmas-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      - database
    networks:
      - tokoalmas-network
    profiles:
      - adminer

# Networks
networks:
  tokoalmas-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    name: tokoalmas-postgres_data

# ============================================================
# Usage Instructions
# ============================================================
# Start the services:
#   docker-compose up -d
#
# Stop the services:
#   docker-compose down
#
# Stop and remove everything:
#   docker-compose down -v
#
# Rebuild and start:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f
#
# Access Adminer UI:
#   http://localhost:8080
#   (Server: database, Username: postgres, Password: postgres, Database: kasirku)
#
# ============================================================